apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: delivery-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root"
        - name: MYSQL_DATABASE
          value: "delivery_db"
        - name: MYSQL_USER
          value: "sami"
        - name: MYSQL_PASSWORD
          value: "sami123"