version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: dms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: delivery_db
      MYSQL_USER: sami
      MYSQL_PASSWORD: sami123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: dms-backend
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: sami
      DB_PASSWORD: sami123
      DB_NAME: delivery_db
      JWT_SECRET: your_secret_key
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: dms-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql-data: